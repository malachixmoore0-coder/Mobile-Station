name: Deploy web apps (Phantom + BRRRR Scout + CompoundForge)

# Builds all static web apps and publishes them together to GitHub Pages
# under one site, since a repo only gets a single live Pages deployment:
#
#   https://<owner>.github.io/mobile-station/                  -> Phantom (dummy wallet)
#   https://<owner>.github.io/mobile-station/brrrr-scout/       -> BRRRR Scout
#   https://<owner>.github.io/mobile-station/compound-forge/    -> CompoundForge
#
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Then run this workflow (it also runs on push).

on:
  push:
    branches:
      - main
      - claude/shortsforge-mobile-app-ofusva
      - claude/phantom-wallet-prank-tuwtj9
      - claude/brrrr-property-analyzer-2rrlsb
      - claude/3d-trading-compounding-app-15i8jj
    paths:
      - 'Phantom-Dummy/**'
      - 'BRRRR-Analyzer/**'
      - 'CompoundForge/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Phantom Dummy dependencies
        working-directory: Phantom-Dummy
        run: npm ci

      - name: Export Phantom Dummy web build
        working-directory: Phantom-Dummy
        # Base path must match the GitHub Pages project path (the repo name,
        # exact casing) so assets load from https://<owner>.github.io/<repo>/.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web

      - name: Install BRRRR Scout dependencies
        working-directory: BRRRR-Analyzer
        run: npm ci

      - name: Export BRRRR Scout web build
        working-directory: BRRRR-Analyzer
        # Nested under /brrrr-scout so it doesn't collide with Phantom at the site root.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/brrrr-scout
        run: npx expo export --platform web

      - name: Install CompoundForge dependencies
        working-directory: CompoundForge
        run: npm ci

      - name: Export CompoundForge web build
        working-directory: CompoundForge
        # Nested under /compound-forge so it doesn't collide with the other apps.
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/compound-forge
        run: npx expo export --platform web

      - name: Assemble combined site
        run: |
          mkdir -p _site/brrrr-scout _site/compound-forge
          cp -r Phantom-Dummy/dist/. _site/
          cp Phantom-Dummy/dist/index.html _site/404.html
          cp -r BRRRR-Analyzer/dist/. _site/brrrr-scout/
          cp -r CompoundForge/dist/. _site/compound-forge/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
